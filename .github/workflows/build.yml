name: Build MechForce

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  web:
    name: Rules test + web/server build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm test
      - run: npm run build
      - name: Package web + dedicated server
        run: |
          mkdir -p out/MechForce-Server
          cp -r dist/web out/MechForce-Server/web
          cp dist/server.cjs out/MechForce-Server/
          printf 'Run: node server.cjs --port 7373\nThen open http://<this-machine-ip>:7373 in any browser, or use Join Game in the apps.\n' > out/MechForce-Server/README.txt
          cd out && zip -qr MechForce-Server-and-Web.zip MechForce-Server
          cp ../dist/artifact/mechforce.html MechForce-Browser.html
      - name: Prepare GitHub Pages site
        run: |
          mkdir -p pages && cp dist/web/index.html pages/index.html && touch pages/.nojekyll
          cp pages/index.html pages/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: pages }
      - uses: actions/upload-artifact@v4
        with:
          name: MechForce-Web-and-Server
          path: |
            out/MechForce-Server-and-Web.zip
            out/MechForce-Browser.html

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run dist:win
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: actions/upload-artifact@v4
        with:
          name: MechForce-Windows
          path: release/*.exe

  linux:
    name: Steam Deck / Linux (AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run dist:linux
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: actions/upload-artifact@v4
        with:
          name: MechForce-SteamDeck-Linux
          path: |
            release/*.AppImage
            release/*.tar.gz

  android:
    name: Android (.apk)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm run build
      - run: npx cap sync android
      - name: Gradle assembleRelease
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace > gradle.log 2>&1
          code=$?
          tail -n 80 gradle.log
          if [ $code -ne 0 ]; then grep -E "error|What went wrong|FAILURE|Exception" gradle.log | head -n 15 | while read -r l; do echo "::error::$l"; done; exit $code; fi
          set -e
          cp app/build/outputs/apk/release/app-release.apk ../MechForce-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MechForce-Android
          path: MechForce-Android.apk

  pages:
    name: Publish web version (GitHub Pages)
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [web]
    runs-on: ubuntu-24.04
    continue-on-error: true
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/configure-pages@v5
        with: { enablement: true }
        continue-on-error: true
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: Publish release
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [web, windows, linux, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - run: find artifacts -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.13.{0}', github.run_number) }}
          name: MechForce ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.13.{0}', github.run_number) }}
          make_latest: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.tar.gz
            artifacts/**/*.apk
            artifacts/**/*.zip
            artifacts/**/*.html
          body: |
            **Downloads**
            - **Windows:** `MechForce-…-Windows-Setup.exe` (installer) or `…-Portable.exe`
            - **Steam Deck / Linux:** `MechForce-…-Linux-SteamDeck.AppImage` — see README for adding it to Steam
            - **Android:** `MechForce-Android.apk` (sideload)
            - **Browser / dedicated server:** `MechForce-Server-and-Web.zip`, or `MechForce-Browser.html` for offline single player

            **Play in your browser:** https://shrieeiee.github.io/MechForce/

            All versions crossplay. **Host Online** on any version (web included) gives a code friends enter in Join Game, or an invite link. Windows / Steam Deck can also **Host LAN Server**.
